services:
  flow2api:
    build:
      context: .
      dockerfile: Dockerfile.headed
    image: flow2api-local:latest
    container_name: flow2api
    init: true
    ports:
      - "8090:8000"
    volumes:
      - ./data:/app/data
      - ./tmp:/app/tmp
      - ./config/setting.toml:/app/config/setting.toml
      - ./static:/app/static
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
      - ALLOW_DOCKER_HEADED_CAPTCHA=true
      - PERSONAL_BROWSER_DISABLE_SANDBOX=true
      - DISPLAY=:99
      - XVFB_SCREEN=1440x900x24
    shm_size: "2gb"
    restart: unless-stopped
