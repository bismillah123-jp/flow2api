services:
  flow2api:
    image: flow2api-local:latest
    container_name: flow2api
    ports:
      - "8090:8000"
    volumes:
      - ./data:/app/data
      - ./tmp:/app/tmp
      - ./config/setting.toml:/app/config/setting.toml
      - ./static:/app/static
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
      - ALLOW_DOCKER_HEADED_CAPTCHA=true
      - PERSONAL_BROWSER_DISABLE_SANDBOX=true
      - BROWSER_EXECUTABLE_PATH=/usr/bin/chromium
    restart: unless-stopped
