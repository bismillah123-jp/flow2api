[global]
api_key = "han1234"
admin_username = "admin"
admin_password = "admin"

[flow]
labs_base_url = "https://flow.google.com"
api_base_url = "https://flow.google.com"
timeout = 120
max_retries = 3
image_request_timeout = 40
image_timeout_retry_count = 1
image_timeout_retry_delay = 0.8
image_timeout_use_media_proxy_fallback = true
image_prefer_media_proxy = false
image_slot_wait_timeout = 480
image_launch_soft_limit = 20
image_launch_wait_timeout = 480
image_launch_stagger_ms = 0
video_slot_wait_timeout = 480
video_launch_soft_limit = 20
video_launch_wait_timeout = 480
video_launch_stagger_ms = 0
poll_interval = 3.0

[server]
host = "0.0.0.0"
port = 8000

[debug]
enabled = false
log_requests = true
log_responses = true
mask_token = true

[proxy]
proxy_enabled = false
proxy_url = ""

[generation]
image_timeout = 300
video_timeout = 1500

[call_logic]
call_mode = "default"  # default=strategi polling acak, polling=strategi polling berurutan

[admin]
error_ban_threshold = 3

[cache]
enabled = false
timeout = 7200  # Timeout cache (detik), default 2 jam; set 0 = tidak auto-hapus
base_url = ""   # Base URL akses file cache, kosongkan = pakai alamat server

[captcha]
captcha_method = "yescaptcha"  # Metode captcha: yescaptcha/captcharun/twocaptcha/capsolver/ezcaptcha/browser/personal/remote_browser
browser_recaptcha_settle_seconds = 3.0  # Tunggu stabil tambahan setelah reload/clr siap untuk tes skor situs kustom
browser_flow_page_warmup_seconds = 6.0  # Tunggu stabil setelah browser harvest membuka halaman Flow
browser_count = 1  # Jumlah instance browser headed untuk mode browser
browser_captcha_max_retries = 5  # Maksimal retry pengambilan captcha per percobaan (mode browser)
browser_captcha_generation_retries = 6  # Total retry saat API generate kena 'reCAPTCHA evaluation failed'
personal_solve_strategy = "auto"  # auto=utamakan trusted JS, gagal → fallback harvest native; direct/harvest bisa dipaksa
personal_project_pool_size = 4  # Jumlah pool project per Token di mode personal (hanya untuk rotasi project, bukan jumlah tab captcha)
personal_max_resident_tabs = 5  # Batas tab captcha shared di mode personal, dipakai bareng semua Token/project
browser_personal_fresh_restart_every_n_solves = 10  # Restart + bersih-bersih browser tiap N captcha sukses di mode personal, 0 = nonaktif
personal_idle_tab_ttl_seconds = 600  # Batas waktu tab idle di mode personal (detik)
yescaptcha_api_key ="ISI_API_KEY_ANDA_DISINI"
yescaptcha_base_url = "https://api.yescaptcha.com"
yescaptcha_task_type = "RecaptchaV3TaskProxylessM1S9"  # Opsional: RecaptchaV3TaskProxyless/RecaptchaV3TaskProxylessM1/RecaptchaV3TaskProxylessM1S7/RecaptchaV3TaskProxylessM1S9
remote_browser_base_url = ""  # Alamat service captcha headed remote
remote_browser_api_key ="ISI_API_KEY_ANDA_DISINI"
remote_browser_timeout = 60   # Timeout request captcha headed remote (detik)
capsolver_api_key = ""
capsolver_base_url = "https://api.capsolver.com"
captcharun_api_key = ""
captcharun_base_url = "https://api.captcha-run.com"

twocaptcha_api_key = ""
twocaptcha_base_url = "https://api.2captcha.com"
